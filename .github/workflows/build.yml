name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip uploaded project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done || true

      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          echo "DIR=$(dirname "$f")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: cp "$DIR/app/build/outputs/apk/release/app-release.apk" GlowRing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlowRing-apk
          path: GlowRing.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GlowRing build ${{ github.run_number }}
          files: GlowRing.apk
